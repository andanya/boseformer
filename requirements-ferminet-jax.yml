# BoseNet environment snapshot taken 2026-11-24 from conda activate ferminet-jax.
# Platform is Linux x86_64 (Conda linux-64) with glibc 2.34 on the source host.
# Python is 3.11.15, packaged by conda-forge.
#
# To recreate the recorded environment on Linux x86_64, run
#   conda env create --file requirements-ferminet-jax.yml
#   conda activate ferminet-jax
#
# BoseNet source repository is https://github.com/andanya/bosenet.
# Branch pbc-dipole-dipole-gen-tail
# HEAD f9fa599386e85918012db862b7cb0b6b55658e9a
# The backup contains the working-tree source, including local scripts.
# The installed upstream ferminet 0.2, with its commit pinned below, is distinct
# from the BoseNet fork under ferminet/ in this checkout. Run commands from the
# BoseNet root with PYTHONPATH=. to select the local source, for example
#   PYTHONPATH=. python scripts/dipole-pbc-hex-N25-pbc-int30.py
#   PYTHONPATH=. JAX_PLATFORMS=cpu python -m pytest -q test
# This also avoids re-resolving the Git dependencies listed in setup.py.
#
# JAX, JAXlib, jax-cuda12-plugin, and jax-cuda12-pjrt are pip wheels at 0.4.34.
# Upstream repository is https://github.com/jax-ml/jax.
# Release tag jax-v0.4.34 points to affba367c5533df8900e32cbc3d31ca92dd1c1ea.
# The JAXlib and CUDA plugin wheels embed that commit. The JAX and PJRT wheels
# carry the release version. The wheel pins below preserve the installed builds.
# Wheel tags are py3-none-any for JAX, cp311-cp311-manylinux2014_x86_64 for
# JAXlib and the CUDA plugin, and py3-none-manylinux2014_x86_64 for CUDA PJRT.
# CUDA user-space libraries and cuDNN are pinned below. The NVIDIA driver is
# supplied by the cluster. The N=25 bare inference log recorded driver
# 580.159.04 with CUDA compatibility reported as 13.0 by nvidia-smi.
# Slurm launchers also record GPU partitions, module loads, and XLA settings.
# Some launchers contain paths for the original cluster checkout and need
# those paths adjusted when submitting jobs from a different checkout.
#
# This is the installed environment at snapshot time. The historical logs do
# not establish the exact package versions present at every earlier job.
#
# One additional editable distribution appeared in the shared environment:
# hallcrystalnet 0.1.0 at /home/da753/hallcrystalnet, from
# https://github.com/andanya/hallcrystalnet, HEAD ecba3eaa2a0eb53bfb6ae828baeaa04f5f3b2ba5.
# That checkout has local edits. BoseNet's staged run scripts use its own
# ferminet package, so the machine-specific editable checkout is recorded here
# and omitted from the install list.
#
# Separate plotting environments found in the worktree
#   astra/SCRIPT-FIGURES/pyproject.toml and uv.lock pin the Python 3.12 plotting
#   environment. The local interpreter symlink targeted cluster Python 3.12.3.
#   The installed plotting distributions were
#     contourpy-1.4.0, cycler-0.12.1, fonttools-4.65.0, kiwisolver-1.5.1, matplotlib-3.11.1, numpy-2.5.3, packaging-26.3, pandas-3.0.5, pillow-12.3.0, pyparsing-3.3.2, python_dateutil-2.9.0.post0, six-1.17.0
#   Some earlier audit scripts used PYTHONPATH=astra/deps. Its installed
#   distributions were
#     contourpy-1.3.3, cycler-0.12.1, fonttools-4.64.0, kiwisolver-1.5.1, matplotlib-3.11.1, numpy-2.5.3, packaging-26.3, pandas-3.0.5, pillow-12.3.0, pyparsing-3.3.2, python_dateutil-2.9.0.post0, scipy-1.18.1, six-1.17.0
#   The backup includes the plotting lockfile and code. Recreate environments
#   separately. Analysis that reads saved runs still needs the original data.
#
# Conda specs below preserve package versions and build strings. Pip entries
# preserve installed package versions and direct Git sources at full commits.
