[build-system]
requires = ["setuptools==82.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "boseformer"
version = "0.2.0"
description = "Variational neural quantum states for interacting bosons"
readme = "README.md"
requires-python = "==3.11.*"
license = "Apache-2.0"
authors = [{name = "Daniil Antonenko", email = "antonenko.daniel@gmail.com"}]

