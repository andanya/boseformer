[project.urls]
Repository = "https://github.com/andanya/bosenet"

[dependency-groups]
# Included by default for the existing GPU workflows; CPU: --no-group cuda.
cuda = [
  "jax-cuda12-pjrt==0.4.34",
  "jax-cuda12-plugin==0.4.34",
  "nvidia-cublas-cu12==12.8.5.5",
  "nvidia-cuda-cupti-cu12==12.8.90",
  "nvidia-cuda-nvcc-cu12==12.8.93",
  "nvidia-cuda-nvrtc-cu12==12.8.93",
  "nvidia-cuda-runtime-cu12==12.8.90",
  "nvidia-cudnn-cu12==9.10.1.4",
  "nvidia-cufft-cu12==11.3.3.83",
  "nvidia-cusolver-cu12==11.7.3.90",
  "nvidia-cusparse-cu12==12.5.7.53",
  "nvidia-nccl-cu12==2.26.2",
  "nvidia-nvjitlink-cu12==12.8.93",
]

[tool.uv]
required-version = ">=0.11.19"
default-groups = ["cuda"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.setuptools.packages.find]
include = ["network", "network.*"]
namespaces = false
