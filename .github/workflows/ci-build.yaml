name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: CPU regression tests (Python 3.11.15)
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORMS: cpu
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.19"
          enable-cache: true
      - name: Install locked CPU environment
        run: uv sync --locked --no-group cuda
      - name: Run paper and disk regression tests
        run: uv run --locked --no-sync python -m pytest -q tests test/test_smooth_contact.py --durations=5
